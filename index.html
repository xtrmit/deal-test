<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F3F8F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A1C" media="(prefers-color-scheme: dark)">
<meta name="description" content="Deal — chasse aux biens à rentabiliser.">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deal">
<title>Deal</title>
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<link rel="icon" id="favicon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" id="appleIcon" href="icons/apple-touch-icon.png">
<script>
  /* Environnement : prod = github.io/deal/, test = github.io/deal-test/, sinon local (PC). */
  (function(){
    var h=location.hostname, p=location.pathname;
    var env = /github\.io$/.test(h) ? (/-test\//.test(p) ? 'test' : 'prod') : 'local';
    window.DEAL_ENV = env;
    if (env !== 'prod') {
      document.getElementById('manifest').href = 'manifest-test.webmanifest';
      document.getElementById('favicon').href = 'icons/test-favicon-64.png';
      document.getElementById('appleIcon').href = 'icons/test-apple-touch-icon.png';
      document.title = 'Deal ' + env.toUpperCase();
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'Deal T';
    }
    try {
      var s = JSON.parse(localStorage.getItem('deal.' + env + '.reglages') || '{}');
      if (s.theme === 'clair' || s.theme === 'sombre') document.documentElement.dataset.theme = s.theme;
      document.documentElement.dataset.fs = String(s.fs == null ? 1 : s.fs);
    } catch (e) {}
  })();
</script>
<script src="version.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="icons/glyphe-64.png" width="29" height="30" alt="" aria-hidden="true">
      <span>Deal</span>
      <span class="tag" id="envTag" hidden></span>
    </div>
    <button class="round" id="meBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </header>

  <main id="main">
    <div id="alerte" class="alerte" hidden></div>
    <div id="nouveautes" class="nouv" hidden></div>
    <section id="liste">
      <div class="filtres">
        <label class="grow"><span class="sr">Rechercher</span><input class="input" id="fTexte" type="search" placeholder="Rechercher (titre, n° d'annonce…)" autocomplete="off"></label>
        <button class="small" id="fPlus" aria-expanded="false">Filtres</button>
      </div>
      <div class="filtres-plus" id="filtresPlus" hidden></div>
      <p class="muted" id="resume"></p>
      <div class="biens" id="biens"></div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="round" id="sheetClose" aria-label="Fermer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</div>

<!-- Connexion (premier lancement) -->
<div class="join" id="join" hidden>
  <div class="join-in">
    <img class="join-logo" src="icons/glyphe-160.png" width="77" height="80" alt="" aria-hidden="true">
    <h1>Deal</h1>
    <div class="seg two" id="joinMode">
      <button data-mode="tel" class="sel">Téléphone</button>
      <button data-mode="pc">Ordinateur</button>
    </div>
    <div id="joinTel" class="join-part">
      <p class="join-text">Sur l'ordinateur, ouvre Réglages → « Ajouter un téléphone », puis scanne le QR code avec l'appareil photo, ou saisis le code.</p>
      <label class="label" for="joinCode">Code d'appairage</label>
      <input id="joinCode" class="input code-in" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="Ex. 3FA9C21B">
      <button class="primary" id="joinBtn">Appairer ce téléphone</button>
      <button class="ghost" id="scanBtn" hidden>Scanner le QR code</button>
    </div>
    <div id="joinPc" class="join-part" hidden>
      <label class="label" for="loginId">Identifiant</label>
      <input id="loginId" class="input" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label class="label" for="loginMdp">Mot de passe</label>
      <input id="loginMdp" class="input" type="password" autocomplete="current-password">
      <button class="primary" id="loginBtn">Se connecter</button>
    </div>
    <p class="join-err" id="joinErr" role="alert"></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="toastUndo" hidden>Annuler</button>
</div>

<script src="js/scoring.js"></script>
<script src="js/qr.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/liste.js"></script>
<script src="js/fiche.js"></script>
<script src="js/reglages.js"></script>
</body>
</html>
